# Pre-commit configuration for NSA Webservice
# Uses the system-installed ruff/mypy (from requirements-dev.txt) so pre-commit,
# terminal, and CI all run the same version.
# See: https://pre-commit.com
#
# Install hooks:
#   pip install pre-commit
#   pre-commit install
#
# Run on all files:
#   pre-commit run --all-files
#
# Run on staged files only (default):
#   pre-commit run
#
# Skip hooks for a single commit:
#   git commit -m "msg" --no-verify

# Pin the minimum pre-commit version for reproducible hook behavior.
minimum_pre_commit_version: "3.8"

# Default to the Python interpreter from the active virtualenv (or the system
# Python if no venv is active).  This ensures hooks use the same environment
# as `pip install -r requirements-dev.txt`.
default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      # ─── Ruff lint ───────────────────────────────────────────────────
      - id: ruff-check
        name: ruff check
        description: "Lint Python files — catches unused imports, undefined names, etc."
        entry: python -m ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: false

      # ─── Ruff format ─────────────────────────────────────────────────
      - id: ruff-format
        name: ruff format
        description: "Format Python files using ruff."
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
        require_serial: false

      # ─── Mypy type checking ──────────────────────────────────────────
      # Runs on app/ with the project's pyproject.toml config.  Consistent
      # with the CI typecheck job (validation.yml) which is currently
      # non-blocking (continue-on-error: true) — this hook mirrors that:
      # mypy errors are reported but do not block the commit.  Remove the
      # `continue-on-error: true` equivalent (the `entry` always exits 0 on
      # type errors via the `|| true` fallback) once the codebase is
      # type-clean enough to make it blocking.
      # Note: requires `mypy` in the active Python environment
      # (pip install mypy).  If mypy is absent, the hook skips gracefully.
      - id: mypy
        name: mypy
        description: "Static type checking — reports type errors in app/ (non-blocking, mirrors CI)."
        entry: bash -c 'python -m mypy --config-file pyproject.toml app/ 2>&1 || true'
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false
        always_run: true

      # ─── Pytest test suite ───────────────────────────────────────────
      # Runs only the CI fast-test subset (not slow markers) to keep commit
      # latency low.  The full suite runs in CI's test-slow job with coverage.
      - id: pytest
        name: pytest (fast subset)
        description: "Run fast (non-slow) tests — skips Qdrant/network/heavy inference tests."
        entry: python -m pytest tests/ -q --no-header -m "not slow"
        language: system
        types_or: [python]
        require_serial: true
        pass_filenames: false

      # ─── CE-v2 regression gate ────────────────────────────────────────
      # Runs the cross-encoder regression harness (evaluation/ce_v2_gate.py)
      # whenever a model checkpoint or the training data is newer than the
      # frozen baseline (i.e. after every retrain).  Skips fast otherwise,
      # and exits 0 on fresh checkouts where the gitignored models are absent.
      # Note: the first commit after a retrain pays ~3-5 min of CPU scoring.
      # Only runs when evaluation/ files or the baseline are modified.
      - id: ce-v2-gate
        name: ce-v2 regression gate
        description: "Fails the commit if a CE retrain regresses vs the frozen baseline (hierarchy <= 4 / same-section <= 1 are targets; enforce with --strict-targets)."
        entry: python -m evaluation.ce_v2_gate --skip-if-unavailable --label pre-commit
        language: system
        require_serial: true
        pass_filenames: false
        files: ^(evaluation/ce_v2_gate\.py|evaluation/ce_v2_eval\.py|evaluation/ce_v2_error_analysis\.py|evaluation/ce_v2_baseline\.json)$

      # ─── JS lint (ESLint) ────────────────────────────────────────────
      # Uses the same npm scripts as the CI js-lint job, so local runs and
      # CI stay in sync. Runs when any .js file under the repo changes.
      - id: js-lint
        name: ESLint (JS)
        description: "Lint vanilla-JS files with ESLint — fails on any warning/error."
        entry: npm run lint:js
        language: system
        types: [javascript]
        require_serial: false
        pass_filenames: false

      # ─── JS format (Prettier) ────────────────────────────────────────
      - id: prettier-format
        name: Prettier (JS)
        description: "Check JS formatting with Prettier — fails on unformatted files."
        entry: npm run format:js
        language: system
        types: [javascript]
        require_serial: false
        pass_filenames: false
