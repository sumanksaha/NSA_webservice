# Pre-commit configuration for NSA Webservice
# Uses the system-installed ruff (from requirements-dev.txt) so pre-commit,
# terminal, and CI all run the same version.
# See: https://pre-commit.com
#
# Install hooks:
#   pip install pre-commit
#   pre-commit install
#
# Run on all files:
#   pre-commit run --all-files
#
# Run on staged files only (default):
#   pre-commit run
#
# Skip hooks for a single commit:
#   git commit -m "msg" --no-verify

repos:
  - repo: local
    hooks:
      # ─── Ruff lint ───────────────────────────────────────────────────
      - id: ruff-check
        name: ruff check
        description: "Lint Python files — catches unused imports, undefined names, etc."
        entry: python -m ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: false

      # ─── Ruff format ─────────────────────────────────────────────────
      - id: ruff-format
        name: ruff format
        description: "Format Python files using ruff."
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
        require_serial: false

      # ─── Mypy type checking ──────────────────────────────────────────
      - id: mypy
        name: mypy
        description: "Static type checking — fails on any type error in app/."
        entry: python -m mypy app/
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false

      # ─── Pytest test suite ───────────────────────────────────────────
      # Note: runs the full suite (~228 tests, ~2 min) on every Python commit.
      - id: pytest
        name: pytest
        description: "Run the full test suite — fails on any failing test."
        entry: python -m pytest tests/ -q --no-header
        language: system
        types_or: [python]
        require_serial: true
        pass_filenames: false

      # ─── JS lint (ESLint) ────────────────────────────────────────────
      # Uses the same npm scripts as the CI js-lint job, so local runs and
      # CI stay in sync. Runs when any .js file under the repo changes.
      - id: js-lint
        name: ESLint (JS)
        description: "Lint vanilla-JS files with ESLint — fails on any warning/error."
        entry: npm run lint:js
        language: system
        types: [javascript]
        require_serial: false
        pass_filenames: false

      # ─── JS format (Prettier) ────────────────────────────────────────
      - id: prettier-format
        name: Prettier (JS)
        description: "Check JS formatting with Prettier — fails on unformatted files."
        entry: npm run format:js
        language: system
        types: [javascript]
        require_serial: false
        pass_filenames: false
