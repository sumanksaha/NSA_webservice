<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case File Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.1);
            border: 1px solid #4ECDC4;
        }
        h1 {
            color: #009688;
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            color: #009688;
            border-bottom: 2px solid #009688;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            min-width: 250px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #009688;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #009688;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            height: 80px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4ECDC4;
        }
        .fssai-lookup {
            display: flex;
            gap: 10px;
        }
        .fssai-lookup input {
            flex: 1;
        }
        .fssai-lookup button {
            padding: 10px 15px;
            background: #009688;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .fssai-lookup button:hover {
            background: #4ECDC4;
        }
        .fssai-info {
            margin-top: 10px;
            padding: 10px;
            background: #e0f7fa;
            border-radius: 4px;
            border-left: 4px solid #009688;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }
        .btn-submit {
            display: block;
            width: 200px;
            margin: 40px auto 0;
            padding: 15px;
            background: #009688;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }
        .btn-submit:hover {
            background: #4ECDC4;
        }
        .error {
            color: #e17055;
            font-size: 14px;
            margin-top: 5px;
        }
        .success {
            color: #00b894;
            font-size: 14px;
            margin-top: 5px;
        }
        .analysis-result-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .analysis-result-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }
        .analysis-result-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Case File Generator</h1>
        
        <form id="caseFileForm" action="/generate_case_file" method="post">
            <!-- Case Information -->
            <div class="form-section">
                <h2>Case Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="case_number">Case Number</label>
                        <input type="text" id="case_number" name="case_number" required placeholder="e.g., 2026/FSS/104">
                    </div>
                    <div class="form-group">
                        <label for="food_safety_officer_name">Food Safety Officer Name</label>
                        <input type="text" id="food_safety_officer_name" name="food_safety_officer_name" required value="Suman Kumar Saha">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="authorization_date">Authorization Date</label>
                        <input type="date" id="authorization_date" name="authorization_date" required>
                    </div>
                    <div class="form-group">
                        <label for="inspection_date">Inspection Date</label>
                        <input type="date" id="inspection_date" name="inspection_date" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="inspection_time">Inspection Time</label>
                        <input type="time" id="inspection_time" name="inspection_time" required value="12:40">
                    </div>
                </div>
            </div>

            <!-- Manufacturer Information -->
            <div class="form-section">
                <h2>Manufacturer Information</h2>
                <div class="form-group">
                    <label for="manufacturer_fssai">Manufacturer FSSAI Number</label>
                    <div class="fssai-lookup">
                        <input type="text" id="manufacturer_fssai" name="manufacturer_fssai" required 
                               placeholder="Enter FSSAI number (starts with 1 or 2)">
                        <button type="button" onclick="lookupFssai('manufacturer')">Lookup</button>
                    </div>
                    <div id="manufacturer_info" class="fssai-info" style="display: none;"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="manufacturer_name">Manufacturer Name</label>
                        <input type="text" id="manufacturer_name" name="manufacturer_name" required 
                               placeholder="Will be auto-filled from FSSAI lookup">
                    </div>
                    <div class="form-group">
                        <label for="manufacturer_fbo_name">Manufacturer FBO Name</label>
                        <input type="text" id="manufacturer_fbo_name" name="manufacturer_fbo_name" required
                               placeholder="Will be auto-filled from FSSAI lookup">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="manufacturer_address">Manufacturer Address</label>
                    <textarea id="manufacturer_address" name="manufacturer_address" required
                              placeholder="Will be auto-filled from FSSAI lookup"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="manufacturer_mfg_date">Manufacturing Date</label>
                    <input type="date" id="manufacturer_mfg_date" name="mfg_date" required>
                </div>
            </div>

            <!-- Retailer Information -->
            <div class="form-section">
                <h2>Retailer Information</h2>
                <div class="form-group">
                    <label for="retailer_fssai">Retailer FSSAI Number</label>
                    <div class="fssai-lookup">
                        <input type="text" id="retailer_fssai" name="retailer_fssai" required
                               placeholder="Enter FSSAI number (starts with 1 or 2)">
                        <button type="button" onclick="lookupFssai('retailer')">Lookup</button>
                    </div>
                    <div id="retailer_info" class="fssai-info" style="display: none;"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="retailer_name">Retailer Name</label>
                        <input type="text" id="retailer_name" name="retailer_name" required
                               placeholder="Will be auto-filled from FSSAI lookup">
                    </div>
                    <div class="form-group">
                        <label for="retailer_fbo_name">Retailer FBO Name</label>
                        <input type="text" id="retailer_fbo_name" name="retailer_fbo_name" required
                               placeholder="Will be auto-filled from FSSAI lookup">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="retailer_address">Retailer Address</label>
                    <textarea id="retailer_address" name="retailer_address" required
                              placeholder="Will be auto-filled from FSSAI lookup"></textarea>
                </div>
            </div>

            <!-- Product Information -->
            <div class="form-section">
                <h2>Product Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="product_name">Product Name</label>
                        <input type="text" id="product_name" name="product_name" required 
                               placeholder="e.g., Taaja Jalpan Nilgiri Chanachur">
                    </div>
                    <div class="form-group">
                        <label for="batch_no">Batch Number</label>
                        <input type="text" id="batch_no" name="batch_no" required placeholder="e.g., IFF">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="sample_quantity">Sample Quantity</label>
                        <input type="text" id="sample_quantity" name="sample_quantity" required value="1000g">
                    </div>
                    <div class="form-group">
                        <label for="packet_count">Packet Count</label>
                        <input type="number" id="packet_count" name="packet_count" required value="4">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="mfg_date">Date of Manufacturing</label>
                        <input type="date" id="mfg_date_product" name="mfg_date" required>
                    </div>
                    <div class="form-group">
                        <label for="expiry_date">Date of Expiry</label>
                        <input type="date" id="expiry_date" name="expiry_date" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="other_food_articles">Other Food Articles Found</label>
                    <input type="text" id="other_food_articles" name="other_food_articles" 
                           value="Chanachur, Nimki, Roasted Chana">
                </div>
                
                <div class="form-group">
                    <label for="total_cost">Total Cost (Rs.)</label>
                    <input type="text" id="total_cost" name="total_cost" required value="500">
                </div>
                
                <div class="form-group">
                    <label for="cost_in_words">Cost in Words</label>
                    <input type="text" id="cost_in_words" name="cost_in_words" required 
                           value="Rupees Five Hundred Only">
                </div>
            </div>

            <!-- Sample Information -->
            <div class="form-section">
                <h2>Sample Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sample_code">Sample Code</label>
                        <input type="text" id="sample_code" name="sample_code" required 
                               placeholder="e.g., SL/WB/110223/2025/13061">
                    </div>
                    <div class="form-group">
                        <label for="sample_submission_date">Sample Submission Date</label>
                        <input type="date" id="sample_submission_date" name="sample_submission_date" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="Lab_Registration_No">Lab Registration Number</label>
                        <input type="text" id="Lab_Registration_No" name="Lab_Registration_No" required 
                               value="WB/FOOD/2025/001">
                    </div>
                    <div class="form-group">
                        <label for="do_receipt_date">DO Receipt Date</label>
                        <input type="date" id="do_receipt_date" name="do_receipt_date" required>
                    </div>
                </div>
            </div>

            <!-- Analysis Result -->
            <div class="form-section">
                <h2>Analysis Result</h2>
                <div class="form-group">
                    <label>Select Analysis Result:</label>
                    <div class="analysis-result-group">
                        <label>
                            <input type="checkbox" id="is_misbranded" name="is_misbranded" value="misbranded">
                            Misbranded
                        </label>
                        <label>
                            <input type="checkbox" id="is_substandard" name="is_substandard" value="substandard">
                            Substandard
                        </label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="analyst_report_no">Analyst Report Number</label>
                        <input type="text" id="analyst_report_no" name="analyst_report_no" required 
                               placeholder="e.g., PK/378/2025-26">
                    </div>
                    <div class="form-group">
                        <label for="analyst_report_date">Analyst Report Date</label>
                        <input type="date" id="analyst_report_date" name="analyst_report_date" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="directive_letter_no">Directive Letter Number</label>
                        <input type="text" id="directive_letter_no" name="directive_letter_no" required
                               placeholder="e.g., H/FSSA/FSO/3054/2025-26">
                    </div>
                    <div class="form-group">
                        <label for="directive_letter_date">Directive Letter Date</label>
                        <input type="date" id="directive_letter_date" name="directive_letter_date" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="retailer_report_receive_date">Retailer Report Receive Date</label>
                        <input type="date" id="retailer_report_receive_date" name="retailer_report_receive_date" required>
                    </div>
                    <div class="form-group">
                        <label for="manufacturer_report_receive_date">Manufacturer Report Receive Date</label>
                        <input type="date" id="manufacturer_report_receive_date" name="manufacturer_report_receive_date" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="applicable_regulation">Applicable Regulation</label>
                    <input type="text" id="applicable_regulation" name="applicable_regulation" 
                           value="Regulation No 5(9)">
                </div>
                
                <div class="form-group">
                    <label for="applicable_clause">Applicable Clause</label>
                    <input type="text" id="applicable_clause" name="applicable_clause"
                           value="Clause (zf) of subsection 1 of section 3 of the FSSA,2006">
                </div>
                
                <div class="form-group">
                    <label for="sample_name">Sample Name</label>
                    <input type="text" id="sample_name" name="sample_name"
                           value="Taaja Jalpan Nilgiri Chanachur">
                </div>
            </div>

            <button type="submit" class="btn-submit">Generate Case Files</button>
        </form>
    </div>

    <script>
        async function lookupFssai(type) {
            const fssaiInput = document.getElementById(`${type}_fssai`);
            const licenseNo = fssaiInput.value.trim();
            
            if (!licenseNo) {
                alert('Please enter a FSSAI number');
                return;
            }
            
            try {
                const response = await fetch('/lookup_fssai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ license_no: licenseNo })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    document.getElementById(`${type}_info`).innerHTML = 
                        `<span class="error">${result.error}</span>`;
                    document.getElementById(`${type}_info`).style.display = 'block';
                    return;
                }
                
                const identity = result.identity;
                
                // Fill the form fields
                document.getElementById(`${type}_name`).value = identity.companyName || '';
                document.getElementById(`${type}_fbo_name`).value = identity.companyName || '';
                document.getElementById(`${type}_address`).value = identity.fullAddress || '';
                
                // Show success message
                document.getElementById(`${type}_info`).innerHTML = 
                    `<strong>Found:</strong> ${identity.companyName}<br>` +
                    `<strong>Address:</strong> ${identity.fullAddress}<br>` +
                    `<strong>Expiry:</strong> ${identity.expiryDate}<br>` +
                    `<strong>Source:</strong> ${identity.source}`;
                document.getElementById(`${type}_info`).style.display = 'block';
                
            } catch (error) {
                console.error('Lookup error:', error);
                document.getElementById(`${type}_info`).innerHTML = 
                    '<span class="error">Error fetching FSSAI data. Please try again.</span>';
                document.getElementById(`${type}_info`).style.display = 'block';
            }
        }
        
        // Format dates for display
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            const dateInputs = document.querySelectorAll('input[type="date"]');
            dateInputs.forEach(input => {
                if (!input.value) {
                    // Leave empty for user to fill
                }
            });
        });
    </script>
</body>
</html>
