<!doctype html>
<html>
    <head>
        <title>Evidence Photo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #000;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .photo-container {
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                text-align: center;
                max-width: 90%;
            }
            .photo {
                max-width: 100%;
                height: auto;
                border-radius: 5px;
                margin-bottom: 20px;
            }
            .photo-info {
                font-size: 14px;
                color: #666;
                margin-bottom: 10px;
            }
            .photo-source {
                font-size: 12px;
                color: #999;
                font-style: italic;
            }
            .verification-badge {
                background-color: #27ae60;
                color: white;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 12px;
                margin-top: 10px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div class="photo-container">
            <img src="{{ image_data }}" alt="Evidence Photo" class="photo" />
            <div class="photo-info">Evidence Photo</div>
            <div class="photo-source">Source: {{ image_url }}</div>
            <div class="verification-badge">&check; Verified</div>
        </div>
    </body>
</html>
