{% extends "base.html" %}

{% block title %}Billing Reimbursement Generator{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fa-solid fa-receipt"></i> Billing & Reimbursement Portal</h2>
    </div>

    <form id="billForm" action="{{ url_for('bill_generator.generate_bill_route') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div id="bill-task-status" class="info-box" style="display: none;"></div>
        <!-- Date Range Filter for Preview -->
        <div class="section-header">
            <h3><i class="fa-solid fa-calendar-alt"></i> Date Range Filter</h3>
        </div>
        <div class="form-row form-row--2">
            <div class="form-group">
                <label for="start_date" class="form-label">Start Date</label>
                <input type="date" id="start_date" name="start_date" class="form-input">
            </div>
            <div class="form-group">
                <label for="end_date" class="form-label">End Date</label>
                <input type="date" id="end_date" name="end_date" class="form-input">
            </div>
            <div class="form-group">
                <div class="btn-group">
                    <button type="button" id="preview-btn" class="btn btn-secondary btn-sm">
                        <i class="fa-solid fa-eye"></i> Preview
                    </button>
                    <span id="preview-error" class="text--error"></span>
                </div>
            </div>
        </div>

        <!-- Officer & Identification Details -->
        <div class="section-header">
            <h3><i class="fa-solid fa-user-tie"></i> FSO details</h3>
        </div>
        <div class="form-row form-row--3">
            <div class="form-group">
                <label for="Name" class="form-label">Officer Name <span class="required"></span></label>
                <input type="text" id="Name" name="Name" class="form-input" required value="" placeholder="Enter FSO / officer name">
            </div>
            <div class="form-group">
                <label for="EMP_ID" class="form-label">Employee ID <span class="required"></span></label>
                <input type="text" id="EMP_ID" name="EMP_ID" class="form-input" required value="81276" placeholder="Enter Employee ID">
            </div>
            <div class="form-group">
                <label for="Designation" class="form-label">Designation <span class="required"></span></label>
                <input type="text" id="Designation" name="Designation" class="form-input" required value="Food Safety Officer" placeholder="e.g. Food Safety Officer">
            </div>
        </div>

        <!-- Sample Details -->
        <div class="section-header">
            <h3><i class="fa-solid fa-vials"></i> Sample & Bill Summary</h3>
        </div>
        <div class="form-row form-row--5">
            <div class="form-group">
                <label for="Enf_samp_No" class="form-label">Enforcement Sample Count <span class="required"></span></label>
                <input type="number" id="Enf_samp_No" name="Enf_samp_No" class="form-input" required value="8" min="0" placeholder="e.g., 8">
            </div>
            <div class="form-group">
                <label for="Enf_samp_Price" class="form-label">Enforcement Price</label>
                <input type="text" id="Enf_samp_Price" name="Enf_samp_Price" class="form-input" readonly placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="Surv_samp_No" class="form-label">Surveillance Sample Count <span class="required"></span></label>
                <input type="number" id="Surv_samp_No" name="Surv_samp_No" class="form-input" required value="7" min="0" placeholder="e.g., 7">
            </div>
            <div class="form-group">
                <label for="Surv_samp_Price" class="form-label">Surveillance Price</label>
                <input type="text" id="Surv_samp_Price" name="Surv_samp_Price" class="form-input" readonly placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="Total_bill" class="form-label">Total Bill Amount (Rs.)</label>
                <input type="text" id="Total_bill" name="Total_bill" class="form-input" required value="6025.55" placeholder="e.g., 6025.55" readonly>
            </div>
        </div>
        <div id="preview-container"></div>

        <div class="form-row form-row--2">
            <div class="form-group">
                <label for="No_of_enfbills" class="form-label">Number of Enforcement Bills <span class="required"></span></label>
                <input type="text" id="No_of_enfbills" name="No_of_enfbills" class="form-input" required value="3" placeholder="e.g., 3">
            </div>
            <div class="form-group">
                <label for="No_of_survbills" class="form-label">Number of Surveillance Bills <span class="required"></span></label>
                <input type="text" id="No_of_survbills" name="No_of_survbills" class="form-input" required value="1" placeholder="e.g., 1">
            </div>
        </div>

        <!-- Sanction Cum Allotment details -->
        <div class="section-header">
            <h3><i class="fa-solid fa-file-invoice-dollar"></i> Sanction & T.R Details</h3>
        </div>
        <div class="form-row form-row--3">
            <div class="form-group">
                <label for="TR_Value" class="form-label">T.R / Allotment Order No <span class="required"></span></label>
                <input type="text" id="TR_Value" name="TR_Value" class="form-input" required value="912" placeholder="e.g., 912">
            </div>
            <div class="form-group">
                <label for="TR_date" class="form-label">T.R / Allotment Date <span class="required"></span></label>
                <input type="date" id="TR_date" name="TR_date" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="Submission_date" class="form-label">Submission Date <span class="required"></span></label>
                <input type="date" id="Submission_date" name="Submission_date" class="form-input" required>
            </div>
        </div>

        <div class="actions-centered">
            <button type="submit" id="billSubmitBtn" class="btn btn-primary btn-lg">
                <i class="fa-solid fa-file-pdf"></i> Generate & Stream Reimbursement PDF
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/task_status.js') }}"></script>
<script>
// Autofill today's date for submission if empty
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    const trDateInput = document.getElementById('TR_date');
    const subDateInput = document.getElementById('Submission_date');

    if (!trDateInput.value) {
        trDateInput.value = '2026-05-15';
    }
    if (!subDateInput.value) {
        subDateInput.value = today;
    }
});

// Asynchronous bill generation: submit via fetch(), poll the QStash task,
// then show a download link for the generated PDF.
document.getElementById('billForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = this;
    var statusBox = document.getElementById('bill-task-status');
    var submitBtn = document.getElementById('billSubmitBtn');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating…';
    statusBox.style.display = 'block';
    statusBox.className = 'info-box';
    statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating bill and generating PDF…';

    TaskPoll.submitAndPoll(form, function(outcome) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Generate & Stream Reimbursement PDF';

        if (outcome.status === 'error') {
            statusBox.className = 'info-box info-box--error';
            var msg = '<i class="fa-solid fa-circle-exclamation"></i> ' +
                (outcome.error || 'Bill generation failed.');
            if (outcome.data && outcome.data.bill_id) {
                // The Bill persisted; only the PDF step failed. Re-submitting
                // the form would create a DUPLICATE bill — say so explicitly.
                msg += '<br><small><i class="fa-solid fa-circle-info"></i> Bill #' +
                    outcome.data.bill_id + ' was created — only the PDF failed. ' +
                    'Do not re-submit this form; it would create a duplicate bill.</small>';
            } else {
                msg += ' — the bill may still have been created.';
            }
            statusBox.innerHTML = msg;
            return;
        }

        var result = outcome.result || {};
        if (result.pdf_result && result.pdf_result.status === 'error') {
            statusBox.className = 'info-box info-box--error';
            statusBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' +
                (result.pdf_result.error || 'PDF generation failed.');
            return;
        }

        var filePath = result.pdf_result ? result.pdf_result.file_path : result.file_path;
        statusBox.className = 'info-box info-box--success';
        statusBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Bill #' + result.bill_id +
            ' created. ' + TaskPoll.downloadLink({ file_path: filePath }, 'Download Bill PDF');
    });
});

// Preview button handler
document.getElementById('preview-btn').addEventListener('click', function() {
    const startDate = document.getElementById('start_date').value;
    const endDate = document.getElementById('end_date').value;
    const errorSpan = document.getElementById('preview-error');

    errorSpan.textContent = '';

    if (!startDate || !endDate) {
        errorSpan.textContent = 'Please select both start and end dates.';
        return;
    }

    if (endDate < startDate) {
        errorSpan.textContent = 'End date must be >= start date.';
        return;
    }

    fetch('/bill/preview?start=' + startDate + '&end=' + endDate)
        .then(function(response) {
            if (!response.ok) {
                return response.json().then(function(err) { throw new Error(err.error || 'Preview failed'); });
            }
            return response.json();
        })
        .then(function(data) {
            document.getElementById('Enf_samp_No').value = data.enforcement_no || 0;
            document.getElementById('Enf_samp_Price').value = (data.enforcement_price || 0).toFixed(2);
            document.getElementById('Surv_samp_No').value = data.surveillance_no || 0;
            document.getElementById('Surv_samp_Price').value = (data.surveillance_price || 0).toFixed(2);
            document.getElementById('Total_bill').value = ((data.enforcement_price || 0) + (data.surveillance_price || 0)).toFixed(2);

            const container = document.getElementById('preview-container');
            container.innerHTML = '';

            if (data.samples && data.samples.length > 0) {
                const table = document.createElement('table');
                table.className = 'data-table samples-table';

                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                ['SI No', 'Sample Code', 'Sample Name', 'Retailer', 'Price', 'Type'].forEach(function(text) {
                    const th = document.createElement('th');
                    th.textContent = text;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                data.samples.forEach(function(sample) {
                    const row = document.createElement('tr');
                    row.innerHTML =
                        '<td>' + (sample.si_no || '') + '</td>' +
                        '<td>' + (sample.sample_code || '') + '</td>' +
                        '<td>' + (sample.sample_name || '') + '</td>' +
                        '<td>' + (sample.retailer_name || '') + '</td>' +
                        '<td class="cell--right cell--monospace">' + (parseFloat(sample.price) || 0).toFixed(2) + '</td>' +
                        '<td>' + (sample.type || '') + '</td>';
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                container.appendChild(table);
            }
        })
        .catch(function(err) {
            errorSpan.textContent = err.message;
            console.error('Preview error:', err);
        });
});
</script>
{% endblock %}
