{% extends "base.html" %}

{% block title %}Inspection Management{% endblock %}

{% block extra_css %}
{{ super() }}
<style>
  /* Inspection module specific overrides — only what isn't in theme.css */
  .inspection-form {
    max-width: 100%;
  }
  .autofill-info.conflict-warning {
    border-left-color: var(--color-error);
    background-color: var(--color-error-bg);
  }
  .photo-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: default;
    transition: var(--transition);
  }
  .photo-badge.has-photos {
    background-color: var(--color-success-bg);
    color: #15803d;
  }
  .photo-badge.no-photos {
    background-color: var(--bg-subtle);
    color: var(--text-body);
  }
</style>
{% endblock %}
