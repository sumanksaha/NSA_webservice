{% extends "base.html" %} {% block title %}Legal RAG{% endblock %} {% block content %}
<div class="rag-query-container">
    <h1>Legal RAG Query</h1>

    {% if RAG_ENABLED %}
    <form id="ragQueryForm" novalidate>
        <div class="form-group">
            <label for="ragQuery">Enter your legal question:</label>
            <textarea
                id="ragQuery"
                name="query"
                rows="4"
                placeholder="e.g., What are the FSS Act penalties for selling substandard food?"
                required
            ></textarea>
        </div>
        <div class="form-group">
            <label for="ragCollection">Collection:</label>
            <select id="ragCollection" name="collection">
                <option value="fssai_legal_768">FSSAI Legal</option>
                <option value="criminal_legal_768">Criminal Legal</option>
            </select>
        </div>
        <button type="submit" id="ragSubmitBtn">Submit Query</button>
    </form>

    <div id="ragLoading" class="rag-loading" style="display: none">
        <p>Processing your query...</p>
    </div>

    <div id="ragResults" class="rag-results" style="display: none">
        <h2>Answer</h2>
        <div id="ragAnswer"></div>
        <div id="ragCitations"></div>
        <div id="ragVerification"></div>
        <div id="ragAuditTrail"></div>

        <div id="ragAwaitingReview" class="rag-review" style="display: none">
            <h3>Awaiting Human Review</h3>
            <p>Your response is being reviewed. Please wait.</p>
            <button id="ragResumeApproved">Approve</button>
            <button id="ragResumeRejected">Reject</button>
        </div>
    </div>

    <div id="ragError" class="rag-error" style="display: none"></div>
    {% endif %}
</div>
{% endblock %} {% block extra_js %}
<script src="{{ url_for('static', filename='js/rag_query.js') }}"></script>
{% endblock %}
