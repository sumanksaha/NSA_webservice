{% extends "base.html" %}

{% block title %}Sample Management{% endblock %}

{% block extra_css %}
{{ super() }}
<style>
    /* Sample module specific styles */
    .sample-form {
        max-width: 800px;
        margin: 0 auto;
    }
    .fssai-lookup {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .fssai-lookup input {
        flex: 1;
    }
    .autofill-info {
        margin-top: 10px;
        padding: 12px;
        background: rgba(22, 36, 74, 0.05);
        border-radius: 6px;
        border-left: 3px solid var(--accent-primary);
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text-body);
    }
    .sample-list-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    .sample-list-table th,
    .sample-list-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
    }
    .sample-list-table th {
        background-color: var(--bg-subtle);
        font-weight: 600;
        color: var(--text-primary);
        cursor: pointer;
        user-select: none;
    }
    .sample-list-table th:hover {
        background-color: var(--bg-card);
    }
    .sample-list-table tr:hover {
        background-color: var(--bg-card);
    }
    .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
    }
    .pagination a,
    .pagination span {
        padding: 8px 12px;
        text-decoration: none;
        color: var(--text-body);
        border: 1px solid var(--border);
        border-radius: 4px;
    }
    .pagination a:hover {
        background-color: var(--bg-subtle);
    }
    .pagination .active {
        background-color: var(--accent-primary);
        color: white;
        border-color: var(--accent-primary);
    }
    .filter-panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 20px;
    }
    .filter-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 10px;
    }
    .filter-group {
        flex: 1;
        min-width: 200px;
    }
    .filter-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        font-size: 0.85rem;
        color: var(--text-body);
    }
</style>
{% endblock %}
