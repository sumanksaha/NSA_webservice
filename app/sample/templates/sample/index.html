{% extends "sample/base_sample.html" %}

{% block title %}Sample Entry{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2><i class="fa-solid fa-vial"></i> Sample Entry Form</h2>
    </div>

    <form id="sampleForm" action="{{ url_for('sample.create_sample') }}" method="post" class="sample-form">
        {{ csrf_token() }}
        <!-- Sample Information -->
        <div class="section-header">
            <h3><i class="fa-solid fa-circle-info"></i> Sample Information</h3>
        </div>

        <div class="form-row form-row--2">
            <div class="form-group">
                <label for="sample_name" class="form-label">Sample Name <span class="required"></span></label>
                <input type="text" id="sample_name" name="sample_name" class="form-input" required placeholder="Enter sample name">
            </div>
            <div class="form-group">
                <label for="sample_type" class="form-label">Sample Type <span class="required"></span></label>
                <select id="sample_type" name="sample_type" class="form-select" required>
                    {% for stype in sample_types %}
                    <option value="{{ stype }}">{{ stype }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row form-row--2">
            <div class="form-group">
                <label for="food_safety_officer_name" class="form-label">Food Safety Officer <span class="required"></span></label>
                <select id="food_safety_officer_name" name="food_safety_officer_name" class="form-select" required>
                    <option value="">-- Select FSO --</option>
                    {% for fso in fso_names %}
                    <option value="{{ fso }}">{{ fso }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="sample_draw_date" class="form-label">Collection Date <span class="required"></span></label>
                <input type="date" id="sample_draw_date" name="sample_draw_date" class="form-input" required>
            </div>
        </div>

        <div class="form-row form-row--2">
            <div class="form-group">
                <label for="sample_submission_date" class="form-label">Submission Date</label>
                <input type="date" id="sample_submission_date" name="sample_submission_date" class="form-input">
            </div>
            <div class="form-group">
                <label for="total_cost" class="form-label">Price (INR)</label>
                <input type="text" id="total_cost" name="total_cost" class="form-input" placeholder="Enter price">
            </div>
        </div>

        <!-- Retailer Information -->
        <div class="section-header">
            <h3><i class="fa-solid fa-shop"></i> Retailer Information</h3>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="retailer_fssai_license" class="form-label">Retailer FSSAI Number</label>
                <div class="lookup-wrapper">
                    <input type="text" id="retailer_fssai_license" name="retailer_fssai_license" class="form-input"
                           placeholder="Enter FSSAI number (starts with 1 or 2)">
                    <button type="button" class="btn btn-secondary" onclick="lookupRetailer()">Lookup</button>
                </div>
                <div id="retailer_info" class="info-box" style="display: none;"></div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full-width">
                <label for="retailer_person_name" class="form-label">Retailer Name</label>
                <input type="text" id="retailer_person_name" name="retailer_person_name" class="form-input" placeholder="Auto-filled from FSSAI lookup">
            </div>
        </div>

        <div class="actions-centered">
            <div class="btn-group">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fa-solid fa-save"></i> Save Sample
                </button>
                <button type="reset" class="btn btn-secondary">
                    <i class="fa-solid fa-undo"></i> Reset
                </button>
                <a href="{{ url_for('sample.list_samples') }}" class="btn btn-secondary">
                    <i class="fa-solid fa-list"></i> View All Samples
                </a>
            </div>
        </div>
    </form>
</div>

{% block extra_js %}
<script>
// Retailer FSSAI lookup
async function lookupRetailer() {
    const fssaiInput = document.getElementById('retailer_fssai_license');
    const retailerNameInput = document.getElementById('retailer_person_name');
    const infoDiv = document.getElementById('retailer_info');

    const fssaiNumber = fssaiInput.value.trim();

    if (!fssaiNumber) {
        infoDiv.style.display = 'none';
        return;
    }

    infoDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Looking up...';
    infoDiv.className = 'info-box';
    infoDiv.style.display = 'block';

    try {
        const response = await fetch('{{ url_for("sample.lookup_retailer") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ retailer_fssai_license: fssaiNumber })
        });

        const data = await response.json();

        if (data.error) {
            infoDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + data.error;
            infoDiv.className = 'info-box info-box--error';
            retailerNameInput.value = '';
        } else {
            infoDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Retailer found: ' + (data.companyName || fssaiNumber);
            infoDiv.className = 'info-box info-box--success';
            retailerNameInput.value = data.companyName || fssaiNumber;
        }
    } catch (error) {
        infoDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Lookup failed: ' + error.message;
        infoDiv.className = 'info-box info-box--error';
        retailerNameInput.value = '';
    }
}

// Form submission handling
document.getElementById('sampleForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
    submitBtn.disabled = true;

    try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            alert('Sample created successfully!\nSample Code: ' + data.sample_code + '\nID: ' + data.sample_id);
            form.reset();
        } else {
            alert('Error: ' + (data.error || 'Failed to create sample'));
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});

// Set today's date as default for sample_draw_date
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('sample_draw_date').value = today;
});
</script>
{% endblock %}
{% endblock %}
