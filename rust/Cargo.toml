[package]
name = "nsa_rust"
version = "0.1.0"
edition = "2021"
description = "PyO3 Rust accelerators for NSA Webservice text processing"
license = "MIT"

[lib]
name = "nsa_rust"
# cdylib = the importable Python extension module (built by maturin);
# rlib = lets `cargo test` compile the crate as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
regex = "1"
unicode-normalization = "0.1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
