# Supabase free-tier keep-alive (2026-08-24).
# Supabase pauses free Postgres projects after ~7 days of inactivity; this
# pings the deployed app's public /health endpoint daily so the pooled DB
# connection never goes stale long enough to trigger the pause.
# Override the target via the PROD_HEALTH_URL repo variable if the domain changes.
name: supabase-keepalive

on:
    schedule:
        - cron: "17 6 * * *" # daily 06:17 UTC
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    ping:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
        steps:
            - name: Ping /health
              run: |
                  # NOTE: do NOT use "${{ vars.X || 'default' }}" — the GHA `||`
                  # operator yields a boolean, not the fallback string. The
                  # default is applied in shell instead.
                  URL="${PROD_HEALTH_URL:-https://nsa-webservice.onrender.com/health}"
                  echo "GET $URL"
                  # Render's free tier sleeps: first hit wakes the service
                  # (~30-60s cold start), so retry transient failures instead
                  # of failing the run on a single slow wake-up.
                  curl --fail --silent --show-error \
                    --connect-timeout 15 --max-time 90 \
                    --retry-all-errors --retry 6 --retry-delay 30 \
                    "$URL"
