# Supabase free-tier keep-alive (2026-08-24).
# Supabase pauses free Postgres projects after ~7 days of inactivity; this
# pings the deployed app's public /health endpoint daily so the pooled DB
# connection never goes stale long enough to trigger the pause.
# Override the target via the PROD_HEALTH_URL repo variable if the domain changes.
name: supabase-keepalive

on:
    schedule:
        - cron: "17 6 * * *" # daily 06:17 UTC
    workflow_dispatch: {}

permissions:
    contents: read
    issues: write

jobs:
    ping:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
        steps:
            - name: Ping /health
              run: |
                  # NOTE: do NOT use "${{ vars.X || 'default' }}" — the GHA `||`
                  # operator yields a boolean, not the fallback string. The
                  # default is applied in shell instead.
                  URL="${PROD_HEALTH_URL:-https://nsa-webservice.onrender.com/health}"
                  echo "GET $URL"
                  # Render's free tier sleeps: first hit wakes the service
                  # (~30-60s cold start), so retry transient failures instead
                  # of failing the run on a single slow wake-up.
                  curl --fail --silent --show-error \
                    --connect-timeout 15 --max-time 90 \
                    --retry-all-errors --retry 6 --retry-delay 30 \
                    "$URL"

            - name: Open alert issue on failure
              if: failure()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # gh resolves the target repo from --repo, GH_REPO, or a git
                  # remote. There is no checkout step here, so the workspace is
                  # not a git repo and GITHUB_REPOSITORY is not a fallback:
                  # without this, every gh call below fails with "not a git
                  # repository" and the alert never fires.
                  GH_REPO: ${{ github.repository }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  # A failed /health ping means the app — and with it the pooled
                  # Postgres connection — is unreachable. Supabase's free tier
                  # pauses the project after ~7 idle days, so a silent failure
                  # here is time-critical: surface it as an open issue instead
                  # of leaving a red run nobody looks at.
                  #
                  # A single issue is reused: the first failure opens it, later
                  # failures comment on it, so a daily schedule cannot flood
                  # the tracker.
                  title="[keepalive] /health ping failing"
                  # Dynamic values arrive via env (WORKFLOW_NAME, RUN_URL) rather
                  # than GitHub expression syntax, so this body stays a plain shell
                  # script that can be syntax-checked without a runner.
                  existing=$(gh issue list --state open --search "$title in:title" --json number --limit 1)
                  printf -v body '%s\n' \
                      "The scheduled \`${WORKFLOW_NAME}\` ping failed at $(date -u +'%Y-%m-%d %H:%M UTC')." \
                      "" \
                      "- Workflow: ${WORKFLOW_NAME}" \
                      "- Run: ${RUN_URL}" \
                      "" \
                      "Supabase free Postgres pauses after ~7 days without a successful query, so two more silent failures could pause the database. Resolve this before then."
                  if [ "$existing" = "[]" ]; then
                      gh issue create --title "$title" --body "$body"
                  else
                      gh issue comment "$(printf '%s' "$existing" | jq -r '.[0].number')" --body "$body"
                  fi
