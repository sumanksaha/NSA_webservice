# Ruff Lint — catches unused imports, coding errors, and style issues
# Runs on every push and pull request to main and upgradation branches.
# See: https://docs.astral.sh/ruff/

name: lint

on:
  push:
    branches: [main, upgradation]
  pull_request:
    branches: [main, upgradation]

jobs:
  ruff-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.6.0

      - name: Run ruff check (catches unused imports, coding issues)
        run: ruff check --output-format=github

  ruff-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.6.0

      - name: Run ruff format check (informational only)
        run: ruff format --check --diff

  js-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint (vanilla JS in app/static/js)
        run: npm run lint:js

      - name: Run Prettier check
        run: npm run format:js
