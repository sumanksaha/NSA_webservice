# Ruff Lint — catches unused imports, coding errors, and style issues
# Runs on every push and pull request to main and upgradation branches.
# See: https://docs.astral.sh/ruff/

name: lint

on:
  push:
    branches: [main, upgradation]
  pull_request:
    branches: [main, upgradation]

# One lint run per ref at a time — superseded pushes cancel in-progress runs
# (https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned to match requirements-dev.txt / .pre-commit-config.yaml so CI,
        # pre-commit and local runs enforce identical rules.
        run: pip install "ruff>=0.16.3"

      - name: Run ruff check (catches unused imports, coding issues)
        run: ruff check --output-format=github

  ruff-format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.16.3"

      - name: Run ruff format check (informational only)
        # The repo is Black-formatted ([tool.black] + black pinned in
        # requirements-dev.txt); ruff format disagrees on ~268 files.  This
        # job is intentionally non-blocking — see pyproject.toml [tool.black].
        continue-on-error: true
        run: ruff format --check --diff

  js-lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint (vanilla JS in app/static/js)
        run: npm run lint:js

      - name: Run Prettier check
        run: npm run format:js
