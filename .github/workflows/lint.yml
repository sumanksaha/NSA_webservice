# Ruff Lint — catches unused imports, coding errors, and style issues
# Runs on every push and pull request to main and upgradation branches.
# See: https://docs.astral.sh/ruff/

name: lint

on:
  push:
    branches: [main, upgradation]
  pull_request:
    branches: [main, upgradation]

jobs:
  ruff-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.6.0

      - name: Run ruff check (catches unused imports, coding issues)
        run: ruff check --output-format=github

  ruff-format:
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking — codebase has legacy format issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.6.0

      - name: Run ruff format check (informational only)
        run: ruff format --check --diff
