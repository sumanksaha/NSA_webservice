# =============================================================================
# NSA Webservice — Repository Validation Workflow
# =============================================================================
# Runs on every push and pull request to ensure code quality, security, and
# correctness. All jobs run in parallel for fast feedback.
#
# Strategy Matrix:
#   - OS: Ubuntu (primary), Windows (compatibility), macOS (optional)
#   - Python: 3.12 (primary)
#
# Jobs:
#   1. format      — Black code formatting check
#   2. lint        — Ruff linting
#   3. typecheck   — Mypy static type analysis
#   4. test        — Pytest unit + integration tests with coverage
#   5. security    — Bandit security scan + pip-audit vulnerability check
#   6. docs        — Documentation structure validation
# =============================================================================

name: Repository Validation

on:
  push:
    branches:
      - main
      - upgradation
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'security/**'
    paths-ignore:
      - '**.md'
      - '**.txt.legacy'
      - '.gitignore'
      - '.editorconfig'
      - '.github/**'
  pull_request:
    branches:
      - main
      - upgradation
    paths-ignore:
      - '**.md'
      - '**.txt.legacy'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Global defaults
# =============================================================================
defaults:
  run:
    shell: bash

# =============================================================================
# Environment variables shared across all jobs
# =============================================================================
env:
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Formatting — Black
  # ---------------------------------------------------------------------------
  format:
    name: Formatting (Black)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: |
          black --check --line-length=120 --target-version=py312 .
        continue-on-error: false

  # ---------------------------------------------------------------------------
  # Job 2: Linting — Ruff
  # ---------------------------------------------------------------------------
  lint:
    name: Linting (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: |
          ruff check --config pyproject.toml .
        continue-on-error: false

  # ---------------------------------------------------------------------------
  # Job 3: Type Checking — Mypy
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Checking (Mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install types-python-dateutil types-requests types-PyYAML

      - name: Run Mypy type checker
        run: |
          mypy --config-file pyproject.toml --ignore-missing-imports app/
        continue-on-error: true  # Don't block PRs on type errors (transitional)

  # ---------------------------------------------------------------------------
  # Job 4: Unit Testing — Pytest with Coverage
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests (Pytest + Coverage)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          # - macos-15  # Uncomment when macOS testing is needed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgobject-2.0-0 libpango-1.0-0 \
            libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
            tesseract-ocr 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing \
            -v --tb=short -x 2>&1
        continue-on-error: false
        env:
          PYTHONPATH: ${{ github.workspace }}
          DISABLE_PDF_GENERATION: "true"
          SECRET_KEY: "ci-test-secret-key-do-not-use"

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage.xml
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            htmlcov/
            .pytest_cache/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Job 5: Security Scanning — Bandit + pip-audit + safety
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit (static security analysis)
        run: |
          bandit --configfile pyproject.toml -r app/ -s B101,B311,B324 \
            --confidence HIGH --severity HIGH -f sarif \
            -o bandit-results.sarif 2>&1 || true
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          pip-audit --requirement requirements.txt --desc 2>&1 || true
        continue-on-error: true

      - name: Run Safety (additional dependency scan)
        run: |
          safety check -r requirements.txt --full-report 2>&1 || true
        continue-on-error: true

      - name: Upload Bandit SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job 6: Documentation Validation
  # ---------------------------------------------------------------------------
  docs:
    name: Documentation Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate documentation files exist
        run: |
          echo "=== Required Documentation ==="
          REQUIRED_FILES=(
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "CHANGELOG.md"
          )
          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file — MISSING"
              MISSING=$((MISSING + 1))
            fi
          done
          echo ""
          echo "=== GitHub Templates ==="
          REQUIRED_TEMPLATES=(
            ".github/ISSUE_TEMPLATE/bug_report.md"
            ".github/ISSUE_TEMPLATE/feature_request.md"
            ".github/ISSUE_TEMPLATE/question.md"
            ".github/pull_request_template.md"
          )
          for file in "${REQUIRED_TEMPLATES[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file — MISSING"
              MISSING=$((MISSING + 1))
            fi
          done
          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "❌ $MISSING required documentation file(s) missing"
            exit 1
          fi
          echo "✅ All required documentation files present"

      - name: Check markdown links (internal)
        run: |
          echo "Checking internal markdown links..."
          grep -rn ']([^h]' README.md | grep -v 'https://' | grep -v 'http://' | \
            while read -r line; do
              link=$(echo "$line" | grep -oP '\]\(\K[^)]+' || true)
              if [ -n "$link" ] && [ "$link" != "..." ]; then
                if [ ! -f "$link" ]; then
                  echo "  ⚠️  Possible broken link: $link (in $line)"
                fi
              fi
            done || true
        continue-on-error: true
