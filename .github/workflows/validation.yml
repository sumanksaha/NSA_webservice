# =============================================================================
# NSA Webservice — Repository Validation Workflow
# =============================================================================
# Runs on every push and pull request to ensure code quality, security, and
# correctness. All jobs run in parallel for fast feedback.
#
# Strategy Matrix:
#   - OS: Ubuntu (primary), Windows (compatibility), macOS (optional)
#   - Python: 3.12 (primary)
#
# Jobs:
#   1. format      — Black code formatting check
#   2. lint        — Ruff linting
#   3. typecheck   — Mypy static type analysis
#   4. test        — Pytest unit + integration tests with coverage
#   5. security    — Bandit security scan + pip-audit vulnerability check
#   6. docs        — Documentation structure validation
#   7. js-test     — ESLint, Prettier, and Node unit tests for static JS
# =============================================================================

name: Repository Validation

on:
    push:
        branches:
            - main
            - upgradation
            - "feat/**"
            - "fix/**"
            - "docs/**"
            - "refactor/**"
            - "security/**"
        paths-ignore:
            - "**.md"
            - ".gitignore"
            - ".editorconfig"
            - ".github/**"
    pull_request:
        branches:
            - main
            - upgradation
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        # Allow manual trigger from GitHub UI

# Cancel in-progress runs for the same branch
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# =============================================================================
# Global defaults
# =============================================================================
defaults:
    run:
        shell: bash

# =============================================================================
# Environment variables shared across all jobs
# =============================================================================
env:
    PYTHON_VERSION: "3.12"
    PYTHONUNBUFFERED: "1"
    FORCE_COLOR: "1"

# =============================================================================
# Jobs
# =============================================================================
jobs:
    # ---------------------------------------------------------------------------
    # Job 1: Formatting — Black
    # ---------------------------------------------------------------------------
    format:
        name: Formatting (Black)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements-dev.txt

            - name: Check formatting with Black
              run: |
                  black --check --line-length=120 --target-version=py312 .
              continue-on-error: false

    # ---------------------------------------------------------------------------
    # Job 2: Linting — Ruff
    # ---------------------------------------------------------------------------
    lint:
        name: Linting (Ruff)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements-dev.txt

            - name: Run Ruff linter
              run: |
                  ruff check --config pyproject.toml .
              continue-on-error: false

    # ---------------------------------------------------------------------------
    # Job 3: Type Checking — Mypy
    # ---------------------------------------------------------------------------
    typecheck:
        name: Type Checking (Mypy)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt -r requirements-dev.txt

            - name: Run Mypy type checker
              run: |
                  mypy --config-file pyproject.toml --ignore-missing-imports app/
              continue-on-error: true # Don't block PRs on type errors (transitional)

    # ---------------------------------------------------------------------------
    # Job 4: Fast Tests — Unit Tests (no Qdrant/network/heavy inference)
    # ---------------------------------------------------------------------------
    test-fast:
        name: Fast Tests (Pytest, no slow)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install system dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq libgobject-2.0-0 libpango-1.0-0 \
                    libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
                    tesseract-ocr 2>/dev/null || true

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt -r requirements-dev.txt

            - name: Run fast (non-slow) tests
              run: |
                  pytest -m "not slow" --tb=short -q \
                    legal_paragraph_detection_engine/tests/ tests/ 2>&1
              continue-on-error: false
              env:
                  PYTHONPATH: ${{ github.workspace }}
                  DISABLE_PDF_GENERATION: "true"
                  SECRET_KEY: "ci-test-secret-key-do-not-use"

    # ---------------------------------------------------------------------------
    # Job 5: Slow Tests — Integration + RAG + DB-backed (Qdrant/network)
    # ---------------------------------------------------------------------------
    test-slow:
        name: Slow Tests (Pytest, slow-marked)
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install system dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq libgobject-2.0-0 libpango-1.0-0 \
                    libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
                    tesseract-ocr 2>/dev/null || true

            - name: Install Python dependencies (incl. optional ML extras)
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements.txt -r requirements-dev.txt
                  pip install -e ".[all]" 2>/dev/null || true

            - name: Run slow (integration/RAG) tests with coverage
              run: |
                  pytest -m "slow" --cov=app --cov-report=xml --cov-report=term-missing \
                    --tb=short -q \
                    legal_paragraph_detection_engine/tests/ tests/ 2>&1
              continue-on-error: false
              env:
                  PYTHONPATH: ${{ github.workspace }}
                  DISABLE_PDF_GENERATION: "true"
                  SECRET_KEY: "ci-test-secret-key-do-not-use"

            - name: Upload coverage report
              if: success()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage.xml
                  retention-days: 7


    # ---------------------------------------------------------------------------
    # Job 6: Security Scanning — Bandit + pip-audit + safety
    # ---------------------------------------------------------------------------
    security:
        name: Security Scan
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel
                  pip install -r requirements-dev.txt

            - name: Run Bandit (static security analysis)
              # BLOCKING (G5, research §4.3): HIGH-severity findings fail the
              # gate. B101 (assert), B311 (random), B324 (hashlib) are skipped
              # as known false positives in web-app/server contexts.
              run: |
                  bandit --configfile pyproject.toml -r app/ -s B101,B311,B324 \
                    --confidence HIGH --severity HIGH -f sarif \
                    -o bandit-results.sarif 2>&1

            - name: Run pip-audit (dependency vulnerability scan)
              # BLOCKING (G5, research §4.3): known CVEs in runtime requirements
              # fail the gate — matching the standalone pip-audit.yml, which is
              # already blocking on main. Fix = bump/replace the flagged pin.
              # (G14, research §4.3): audit dev dependencies too — requirements-dev.txt
              # was never scanned anywhere in the pipeline.
              run: |
                  pip-audit --requirement requirements.txt --requirement requirements-dev.txt --desc
              continue-on-error: false

            - name: Run Safety (additional dependency scan)
              # BLOCKING (G5, research §4.3): overlaps pip-audit with a different
              # vulnerability DB; both must agree there is no untriaged noise.
              run: |
                  safety check -r requirements.txt --full-report 2>&1

            - name: Upload Bandit SARIF results
              if: always()
              uses: github/codeql-action/upload-sarif@v4.37.9
              with:
                  sarif_file: bandit-results.sarif
                  category: bandit
              continue-on-error: true

    # ---------------------------------------------------------------------------
    # Job 7: Documentation Validation
    # ---------------------------------------------------------------------------
    docs:
        name: Documentation Validation
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Validate documentation files exist
              run: |
                  echo "=== Required Documentation ==="
                  REQUIRED_FILES=(
                    "README.md"
                    "LICENSE"
                    "SECURITY.md"
                    "CONTRIBUTING.md"
                    "CODE_OF_CONDUCT.md"
                    "CHANGELOG.md"
                  )
                  MISSING=0
                  for file in "${REQUIRED_FILES[@]}"; do
                    if [ -f "$file" ]; then
                      echo "  ✅ $file"
                    else
                      echo "  ❌ $file — MISSING"
                      MISSING=$((MISSING + 1))
                    fi
                  done
                  echo ""
                  echo "=== GitHub Templates ==="
                  REQUIRED_TEMPLATES=(
                    ".github/ISSUE_TEMPLATE/bug_report.md"
                    ".github/ISSUE_TEMPLATE/feature_request.md"
                    ".github/ISSUE_TEMPLATE/question.md"
                    ".github/pull_request_template.md"
                  )
                  for file in "${REQUIRED_TEMPLATES[@]}"; do
                    if [ -f "$file" ]; then
                      echo "  ✅ $file"
                    else
                      echo "  ❌ $file — MISSING"
                      MISSING=$((MISSING + 1))
                    fi
                  done
                  echo ""
                  if [ $MISSING -gt 0 ]; then
                    echo "❌ $MISSING required documentation file(s) missing"
                    exit 1
                  fi
                  echo "✅ All required documentation files present"

            - name: Check markdown links (internal)
              run: |
                  echo "Checking internal markdown links..."
                  grep -rn ']([^h]' README.md | grep -v 'https://' | grep -v 'http://' | \
                    while read -r line; do
                      link=$(echo "$line" | grep -oP '\]\(\K[^)]+' || true)
                      if [ -n "$link" ] && [ "$link" != "..." ]; then
                        if [ ! -f "$link" ]; then
                          echo "  ⚠️  Possible broken link: $link (in $line)"
                        fi
                      fi
                    done || true
              continue-on-error: true

    # ---------------------------------------------------------------------------
    # Job 8: JavaScript — ESLint, Prettier, Node unit tests
    # ---------------------------------------------------------------------------
    js-test:
        name: JS Lint, Format & Tests
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install JS dev dependencies
              run: |
                  npm install --no-audit --no-fund

            - name: Lint static JS with ESLint
              run: |
                  npm run lint:js

            - name: Check JS formatting with Prettier
              run: |
                  npm run format:js

            - name: Run JS unit tests
              run: |
                  npm run test:js
