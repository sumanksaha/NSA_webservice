# =============================================================================
# NSA Webservice — Gated Production Deploy (Render)
# =============================================================================
# Deploys to Render ONLY after the "Repository Validation" workflow passes on
# main (CI/CD research doc §4.1 — closes gaps G1 "tests don't gate deploys"
# and G13 "no deploy serialization").
#
# Mechanism (per official docs):
#   * workflow_run fires when the named workflow concludes; this file must
#     live on the default branch:
#     https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run
#   * Render deploy hook triggers a render.yaml blueprint deploy and accepts
#     ?ref=<sha> to pin the exact validated commit:
#     https://render.com/docs/deploy-hooks ("Using with GitHub Actions")
#
# REQUIRED SETUP (one-time, dashboard-side):
#   1. render.yaml sets autoDeploy: false on both services.
#   2. In Render: Settings → Deploy Hook → copy the URL.
#   3. In GitHub: Settings → Secrets and variables → Actions → new secret
#      RENDER_DEPLOY_HOOK_URL with that URL.
#
# Manual deploys remain possible via workflow_dispatch (uses the same hook).
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ["Repository Validation"] # must match validation.yml `name:`
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: "main"
        type: string

concurrency:
  group: render-deploy # serialize deploys — never overlap production cutovers
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Deploy validated commit to Render
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: production
      url: https://food-adjudication-portal.onrender.com

    steps:
      - name: Resolve the commit being deployed
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.event.inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy hook (pinned to the validated commit)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          REF: ${{ steps.ref.outputs.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. See the setup checklist in this file's header."
            exit 1
          }
          # The hook URL already carries ?key=... — append &ref= when present,
          # otherwise use ?ref= (separator-safe per render.com/docs/deploy-hooks).
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) HOOK="${RENDER_DEPLOY_HOOK_URL}&ref=${REF}" ;;
            *)    HOOK="${RENDER_DEPLOY_HOOK_URL}?ref=${REF}" ;;
          esac
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "$HOOK"

      - name: Wait for the deploy to go live, then verify /health
        run: |
          # Render's healthCheckPath (/health) already gates traffic cutover
          # server-side (https://render.com/docs/health-checks); this is the
          # post-deploy verification leg for the Actions log.
          echo "Deploy triggered for ${REF}; Render health gate (/health) controls cutover."
          sleep 30
          curl --fail --retry 5 --retry-delay 15 \
            https://food-adjudication-portal.onrender.com/health
