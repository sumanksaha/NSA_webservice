# CE-v2 Regression Gate — validates the gate logic in CI on every change to
# the harness/gate scripts or the frozen baseline, and runs the *real* gate
# on demand from published Hugging Face assets.
#
# Two paths:
#   1. gate-logic (push/PR + dispatch): torch-free fixture tests pinning the
#      gate's comparison logic; the real gate run happens locally via the
#      `ce-v2-gate` pre-commit hook (models + training data live in the
#      gitignored `evaluation/out/` tree on the training machine).
#   2. real-gate (dispatch only): downloads the published checkpoints
#      (sumanksaha/legal-ce-v1, sumanksaha/Foodmultidomain) and gate data
#      (sumanksaha/ce-v2-gate-assets, published by
#      `python -m evaluation.publish_ce_v2_assets` with a write token) and
#      runs the full harness + gate on a GitHub runner.

name: CE-v2 Regression Gate

on:
  push:
    paths:
      - "evaluation/ce_v2_eval.py"
      - "evaluation/ce_v2_error_analysis.py"
      - "evaluation/ce_v2_gate.py"
      - "evaluation/ce_v2_baseline.json"
      - "tests/test_ce_v2_gate.py"
  pull_request:
    paths:
      - "evaluation/ce_v2_eval.py"
      - "evaluation/ce_v2_error_analysis.py"
      - "evaluation/ce_v2_gate.py"
      - "evaluation/ce_v2_baseline.json"
      - "tests/test_ce_v2_gate.py"
  workflow_dispatch:
    # Manual trigger from the GitHub UI.  Use the inputs to gate a newly
    # pushed retrain (defaults = the published control + candidate).
    inputs:
      model_v1_repo:
        description: Control checkpoint repo (default sumanksaha/legal-ce-v1)
        required: false
        default: sumanksaha/legal-ce-v1
      model_v2_repo:
        description: Candidate checkpoint repo (default sumanksaha/Foodmultidomain = legal_ce_v2_K500)
        required: false
        default: sumanksaha/Foodmultidomain
      assets_repo:
        description: Gate data repo (default sumanksaha/ce-v2-gate-assets)
        required: false
        default: sumanksaha/ce-v2-gate-assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  gate-logic:
    name: Gate logic (fixture mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest and ruff
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run gate logic tests
        run: |
          pytest tests/test_ce_v2_gate.py -q --no-header

      - name: Lint the harness + gate scripts
        run: |
          ruff check evaluation/ce_v2_eval.py evaluation/ce_v2_error_analysis.py evaluation/ce_v2_gate.py

  real-gate:
    # Dispatch-only, matching the file header's documented contract ("real-gate
    # (dispatch only)") — without this guard the job's torch install + HF
    # downloads ran on every qualifying push (~40 min of runner time).
    if: github.event_name == 'workflow_dispatch'
    name: Real gate (published HF assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install CPU torch + sentence-transformers
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers huggingface_hub

      - name: Download models + gate data
        run: |
          python -m evaluation.fetch_ce_v2_gate_assets \
            --model-v1-repo "${{ github.event.inputs.model_v1_repo || 'sumanksaha/legal-ce-v1' }}" \
            --model-v2-repo "${{ github.event.inputs.model_v2_repo || 'sumanksaha/Foodmultidomain' }}" \
            --assets-repo "${{ github.event.inputs.assets_repo || 'sumanksaha/ce-v2-gate-assets' }}"

      - name: Run the regression gate
        run: |
          python -m evaluation.ce_v2_gate --force --label ci-real
