# =============================================================================
# NSA Webservice — Dependency Vulnerability Audit
# =============================================================================
# Runs pip-audit on every push/PR to main to detect known vulnerabilities
# in Python dependencies.
# =============================================================================

name: Dependency Audit (pip-audit)

on:
  push:
    branches: [main, upgradation]
  pull_request:
    branches: [main, upgradation]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc
