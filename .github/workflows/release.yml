# =============================================================================
# NSA Webservice — Release Workflow (ACTIVE)
# =============================================================================
# Automates the release process:
#   1. On tag push (v*.*.*): create a GitHub Release with auto-generated notes
#   2. On workflow_dispatch: create the tag, push it, then create the Release
#
# G8 (CI/CD research §1.5, §4.5): release/tag automation is now active.
# The `workflow_dispatch` path lets maintainers create releases by version;
# the `push: tags` path lets CI create releases when a collaborator pushes
# a tag directly (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
#
# Note: version is still bumped manually in pyproject.toml — this workflow
# does NOT edit pyproject.toml. The tag name IS the version declaration.
# =============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0, 1.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      target:
        description: "Target branch/commit for the release"
        required: true
        default: "upgradation"
        type: string

  # Tag-triggered release — active per G8 (was commented out, §1.5)
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # G8: job is active (if: false removed) with proper permissions
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target || github.ref_name }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag-triggered: GITHUB_REF_NAME is like "v1.0.0"
            v="${GITHUB_REF_NAME#v}"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: ${{ steps.version.outputs.version }}"

      - name: Create Git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            Automated release of v${{ steps.version.outputs.version }}
            Generated by the NSA Webservice release workflow.
          draft: false
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
