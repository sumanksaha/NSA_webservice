# Render Blueprint Configuration for NSA Webservice

services:
    - type: web
      name: food-adjudication-portal
      env: python
      buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && playwright install chromium && apt-get update && apt-get install -y libgobject-2.0-0 libpango-1.0-0 libpangoft2-1.0.0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libfontconfig1
      startCommand: FLASK_APP=app:create_app flask db upgrade && gunicorn --bind 0.0.0.0:10000 app:app
      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: nsa-webservice-db
                property: connectionString
          - key: SECRET_KEY
            generateValue: true
          - key: REDIS_URL
            sync: false
          - key: SPREADSHEET_ID
            sync: false
          - key: GOOGLE_CREDENTIALS_JSON
            sync: false
          - key: R2_ACCESS_KEY
            sync: false
          - key: R2_SECRET_KEY
            sync: false
          - key: R2_BUCKET
            sync: false
          - key: R2_ENDPOINT
            sync: false
          - key: R2_PUBLIC_BASE_URL
            sync: false
          - key: R2_REGION
            value: auto
          - key: DISABLE_PDF_GENERATION
            value: "false"
          - key: PDF_USE_DIRECT_URLS
            value: "false"
          - key: QSTASH_TOKEN
            sync: false
          - key: QSTASH_CURRENT_SIGNING_KEY
            sync: false
          - key: QSTASH_NEXT_SIGNING_KEY
            sync: false
          - key: PUBLIC_BASE_URL
            sync: false
          - key: CLOUDINARY_CLOUD_NAME
            sync: false
          - key: CLOUDINARY_API_KEY
            sync: false
          - key: CLOUDINARY_API_SECRET
            sync: false
          - key: AIRTABLE_API_KEY
            sync: false
          - key: AIRTABLE_BASE_ID
            sync: false
          - key: ENABLE_AIRTABLE_SYNC
            value: "true"
          - key: MS_TENANT_ID
            sync: false
          - key: MS_CLIENT_ID
            sync: false
          - key: MS_CLIENT_SECRET
            sync: false
          - key: MS_DRIVE_ID
            sync: false
          - key: MS_SPREADSHEET_ID
            sync: false
          - key: ENABLE_EXCEL_SYNC
            value: "false"

    - type: worker
      name: food-adjudication-celery-worker
      env: python
      buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && playwright install chromium && apt-get update && apt-get install -y libgobject-2.0-0 libpango-1.0-0 libpangoft2-1.0.0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libfontconfig1
      startCommand: celery -A app.celery worker --loglevel=info
      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: nsa-webservice-db
                property: connectionString
          - key: SECRET_KEY
            generateValue: true
          - key: REDIS_URL
            sync: false
          - key: SPREADSHEET_ID
            sync: false
          - key: GOOGLE_CREDENTIALS_JSON
            sync: false
          - key: R2_ACCESS_KEY
            sync: false
          - key: R2_SECRET_KEY
            sync: false
          - key: R2_BUCKET
            sync: false
          - key: R2_ENDPOINT
            sync: false
          - key: R2_PUBLIC_BASE_URL
            sync: false
          - key: R2_REGION
            value: auto
          - key: DISABLE_PDF_GENERATION
            value: "false"
          - key: PDF_USE_DIRECT_URLS
            value: "false"
          - key: SKIP_FSO_STARTUP_SYNC
            value: "1"
          - key: CLOUDINARY_CLOUD_NAME
            sync: false
          - key: CLOUDINARY_API_KEY
            sync: false
          - key: CLOUDINARY_API_SECRET
            sync: false
          - key: AIRTABLE_API_KEY
            sync: false
          - key: AIRTABLE_BASE_ID
            sync: false
          - key: ENABLE_AIRTABLE_SYNC
            value: "true"
          - key: MS_TENANT_ID
            sync: false
          - key: MS_CLIENT_ID
            sync: false
          - key: MS_CLIENT_SECRET
            sync: false
          - key: MS_DRIVE_ID
            sync: false
          - key: MS_SPREADSHEET_ID
            sync: false
          - key: ENABLE_EXCEL_SYNC
            value: "false"

databases:
    - name: nsa-webservice-db
      plan: free
      databaseName: nsa_db
      user: nsa_user
