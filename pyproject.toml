[build-system]
requires = ["setuptools>=70,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsa-webservice"
version = "0.9.0"
description = "Government-grade Legal Intelligence Platform for Food Safety Officer adjudication, inspection tracking, sample management, and legal document generation."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Suman Saha", email = "github@sumansaha.com" }]
keywords = [
  "food-safety",
  "adjudication",
  "legal-intelligence",
  "fssai",
  "government",
  "workflow-automation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Government",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Workflow",
  "Topic :: Security",
  "Typing :: Typed",
]

dependencies = [
  "alembic>=1.13.0",
  "flask",
  "flask-sqlalchemy",
  "flask-migrate",
  "gspread>=6.2.1",
  "google-auth>=2.56.0",
  "jinja2",
  "psycopg2-binary>=2.9.9",        # driver v2: SQLAlchemy URI + scripts/ batch upserts (execute_values); v3 below is separate
  "weasyprint",
  "python-multipart",
  "num2words",
  "gunicorn",
  "openpyxl",
  "boto3",
  "python-dotenv>=1.0.0",
  "flask-talisman>=1.1.0",
  "flask-wtf>=1.2.0",
  "flask-login>=0.6.3",
  "redis>=5.0.0",
  "qstash>=3.4.0",          # Upstash QStash - serverless task queue (webhook-based, no worker)

  "cloudinary>=1.40.0", # Cloudinary photo upload (active when CLOUDINARY_* env vars are set)
  "pyairtable>=1.0.0",  # Airtable sync - Multi-Target Sheets Redundancy (Priority 7)
  "httpx>=0.27.0",      # HTTP client for Airtable base-rotation REST calls
  "msal>=1.0.0",        # Microsoft Excel Online sync (MS Graph API auth)


  "pytesseract>=0.3.10",
  "pdf2image>=1.16.3",
  "pillow>=9.0.0",                 # image compression + thumbnail generation (evidence blueprint)
  "tenacity>=8.2.0",               # exponential-backoff retries on Cloudinary network calls (storage hardening)
  "qrcode>=8.0",                   # QR code generation for PDF assembly
  "pdfplumber>=0.10.0",
  "PyMuPDF>=1.25.0",
  "python-docx>=1.1.0",
  "pydantic>=2.0.0",
  "orjson>=3.10.0",
  "chardet>=5.0.0",
  "tqdm>=4.65.0",
  "rapidfuzz>=3.0.0",              # fuzzy string matching - search fallback (Phase 10) + document cleaner normalizers
  "numpy>=1.26.0",                 # OCR pipeline runtime dependency (undeclared) - test_ocr_pipeline fails to collect without it
  "qdrant-client>=1.9.0",          # Qdrant vector store (local or Qdrant Cloud via RAG_QDRANT_URL/API_KEY)
  "langgraph>=1.0.0",              # M3 LangGraph agent pipeline (POST /api/rag/query/agent; imported lazily)
  "langgraph-checkpoint-postgres>=3.0.0",  # M5 PostgresSaver (resume/interrupt; imported lazily)
  "psycopg-binary>=3.1.0",         # driver v3: langgraph-checkpoint-postgres (imported lazily) — deliberately coexists with v2 above
  # FastAPI ASGI entry-point (FASTAPI_IMPLEMENTATION_PLAN.md, Ambition B)
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "asgiref>=3.8.0",
  "a2wsgi>=1.10.10",
  "supabase>=2.0.0",  # Phase 17: cloud-sync bridge (optional; app boots without it via lazy import)
  # Observability (issues #71-#75): error tracking + Prometheus metrics.
  # Pinned exactly: the Sentry docs site documents a 3.x line that is alpha-only
  # on PyPI, so an unpinned install would not be reproducible.
  "sentry-sdk[flask]==2.73.0",
  "prometheus-client==0.26.0",
  # Security floor (pip-audit gate, 2026-10-25): filelock is transitive
  # (huggingface-hub, torch, transformers) and 3.32.7 is flagged by
  # CVE-2026-112907 / CVE-2026-112913 / CVE-2026-112940. Fixed in 4.2.1;
  # pin the floor so the resolve cannot fall back to a vulnerable build.
  "filelock>=4.2.1",
  # NOTE: heavy ML deps (sentence-transformers, fastembed, easyocr,
  # opencv-python-headless) are OPTIONAL — install via the [ocr] and
  # [embeddings] extras, or [all] for both.  The app boots and serves
  # all non-OCR/non-embedding routes without them; remote inference
  # (Modal / RAG_EMBED_ENDPOINT) is the production path.
]

[project.optional-dependencies]
ocr = [
  "easyocr>=1.7.0",                # OCR engine for scanned legal PDFs (English + Hindi)
  "opencv-python-headless>=4.9.0", # OCR image preprocessing (no GUI deps)
]
embeddings = [
  "sentence-transformers>=3.0.0",  # RAG embedding model (RAG_EMBEDDING_MODEL)
  "fastembed>=1.0.0",              # BM25 sparse embeddings for hybrid retrieval (RAG_SPARSE_MODEL)
]
# NOTE: expanded to the union of the ocr + embeddings extras. PEP 621 treats
# bare names in an extra (e.g. "ocr") as *package* requirements, not as
# references to sibling extras, which breaks `pip install .[all]` / `uv lock`.
all = [
  "easyocr>=1.7.0",                # from [ocr]
  "opencv-python-headless>=4.9.0", # from [ocr]
  "sentence-transformers>=3.0.0",  # from [embeddings]
  "fastembed>=1.0.0",              # from [embeddings]
]
# CPU-only sparse (BM25) retrieval for Render (env: python 3.12-3.15).
# fastembed>=1.0 ships onnxruntime-only wheels (no torch) for CPython 3.10-3.15;
# the app only uses SparseTextEmbedding + the `Qdrant/bm25` model (stable 0.8-1.x).
sparse = ["fastembed>=1.0.0"]

dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  # pytest-flask removed: its autouse _push_request_context fixture pops a
  # request context whose teardown ordering conflicts with fixture-managed
  # app contexts on Flask 3.1.3 + pytest 9.x (~147 teardown LookupErrors).
  # No test uses its fixtures (client/client_class/live_server are all
  # defined locally); re-add only if pytest.mark.options is ever needed.
  "black>=26.5.1",
  "ruff>=0.16.3",
  "mypy>=2.3.0",
  "bandit>=1.9.4",
  "bandit-sarif-formatter==1.1.1", # SARIF reporter for bandit (CI CodeQL upload)
  "pre-commit>=4.6.1",
  "pip-audit>=2.7.3",
  # safety removed (2026-10-25): its `check` command was already dropped from
  # validation.yml on 2026-10-11 (it crashed before scanning), and the latest
  # release (3.8.1) hard-caps `filelock<4.0`, which makes the resolve pick the
  # vulnerable 3.32.x and fails the blocking pip-audit gate (CVE-2026-112907 /
  # -112913 / -112940). pip-audit covers the same advisory DB. Re-add only if a
  # release relaxes that cap.
  "types-requests>=2.33.0.20260712",
  "types-python-dateutil>=2.9.0.20260716",
  "types-PyYAML>=6.0.12.20260724",
  "vulture>=2.16",
  "py-spy>=0.4.2",
  "psutil>=5.9", # memory-usage integration test (LPDE test_integration)
  "maturin>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/sumanksaha/NSA_webservice"
Repository = "https://github.com/sumanksaha/NSA_webservice"
Documentation = "https://github.com/sumanksaha/NSA_webservice"
Changelog = "https://github.com/sumanksaha/NSA_webservice/blob/upgradation/CHANGELOG.md"
Issues = "https://github.com/sumanksaha/NSA_webservice/issues"

# =============================================================================
# Tool: Black - The uncompromising Python code formatter
# =============================================================================
[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    migrations/versions/
  | \.eggs/
  | \.git/
  | \.hg/
  | \.mypy_cache/
  | \.tox/
  | \.venv/
  | venv/
  | _build/
  | buck-out/
  | build/
  | dist/
  | node_modules/
  | __pycache__/
)/
'''

# =============================================================================
# Tool: Ruff - An extremely fast Python linter
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "F",   # Pyflakes - errors (unused imports, undefined names, etc.)
  "E",   # Pycodestyle - errors
  "W",   # Pycodestyle - warnings
  "I",   # isort - import sorting
  "N",   # PEP 8 naming conventions
  "UP",  # Pyupgrade - modern Python syntax
  "S",   # Bandit - security checks
  "B",   # flake8-bugbear - bug detection
  "SIM", # flake8-simplify - code simplification
  "T20", # flake8-print - print statements
  "RUF", # Ruff-specific rules
]
ignore = [
  "E501", # Line too long (handled by Black)
  "E402", # Module import not at top of file (needed for Flask app factory)
  "S101", # Use of assert (allowed in tests)
  "B008", # Do not perform function calls in argument defaults (Flask pattern)
  "N818", # Exception name should be named with an Error suffix (false positives)
  # Best-effort exception swallowing is a deliberate pattern across the
  # RAG/backup layers (e.g. `except Exception: pass` on optional network
  # calls that must not take the app down) — already annotated BLE001/noqa
  # where an alternative exists.
  "S110", # try-except-pass
  "S112", # try-except-continue
  # Ambiguous unicode characters in legal text (en-dashes in Act titles,
  # ×/∪/∨ in set notation) are meaningful content, not typos — replacing
  # them would alter quoted legal wording.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S310", "S311", "SIM115", "T20", "B017", "SIM117", "N806", "N814", "N817"]
