[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsa-webservice"
version = "0.1.0"
description = "NSA Food Adjudication & Billing Suite"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    "flask",
    "flask-sqlalchemy",
    "flask-migrate",
    "gspread==6.2.1",
    "google-auth==2.56.0",
    "jinja2",
    "psycopg2-binary>=2.9.9",
    "weasyprint",
    "python-multipart",
    "num2words",
    "httpx",
    "gunicorn",
    "openpyxl",
    "boto3",
    "python-dotenv>=1.0.0",
    "flask-talisman>=1.1.0",
    "flask-wtf>=1.2.0",
    "flask-login>=0.6.3",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "pip-audit>=2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]