# =============================================================================
# NSA Legal Intelligence Platform — Project Configuration
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nsa-webservice"
version = "1.0.1"
description = "Food Safety Legal Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["food-safety", "inspection", "adjudication", "flask"]
dependencies = [
  "alembic>=1.13.0",
  "flask",
  "flask-sqlalchemy",
  "flask-migrate",
  "gspread==6.2.1",
  "google-auth==2.56.0",
  "jinja2",
  "psycopg2-binary>=2.9.9",
  "weasyprint",
  "python-multipart",
  "num2words",
  "httpx",
  "gunicorn",
  "openpyxl",
  "boto3",
  "python-dotenv>=1.0.0",
  "flask-talisman>=1.1.0",
  "flask-wtf>=1.2.0",
  "flask-login>=0.6.3",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "pytesseract>=0.3.10",
  "pdf2image>=1.16.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "coverage>=7.0.0",
  "pre-commit>=3.7.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "black>=24.3.0",
  "isort>=5.12.0",
  "bandit>=1.7.0",
  "safety>=3.0.0",
  "pip-audit>=2.7.0",
  "types-python-dateutil>=2.9.0",
  "types-requests>=2.31.0",
  "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.mypy_cache
  | \.venv
  | venv
  | migrations
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
files = "app/"

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv", "venv"]
skips = ["B101", "B311", "B324"]