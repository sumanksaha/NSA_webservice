# =============================================================================
# Tool: Pytest - Python testing framework
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "legal_paragraph_detection_engine/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --no-header"
markers = [
  "slow: marks tests that require Qdrant/network/heavy inference (deselected by 'fast-tests' CI job)",
]

filterwarnings = [
  "ignore::DeprecationWarning:flask_sqlalchemy.*",
  "ignore::DeprecationWarning:sqlalchemy.*",
  "ignore::UserWarning:weasyprint.*",
  "ignore::PendingDeprecationWarning:werkzeug.*",
  # Allow all other warnings to surface
]

# =============================================================================
# Tool: Coverage.py - Code coverage measurement
# =============================================================================
[tool.coverage.run]
source = ["app", "legal_paragraph_detection_engine.src"]
omit = [
  "*/legal_paragraph_detection_engine/tests/*",
  "*/legal_paragraph_detection_engine/examples/*",
  "*/migrations/*",
  "*/tests/*",
  "*/venv/*",
  "*/instance/*",
  "app/__init__.py",
  "app.py",
]
command_line = "-m pytest"

[tool.coverage.report]
# Coverage gate (CI/CD research doc G6 / §4.3).
#
# MEASURED CONTEXT (2026-10-11): only ~1356 of ~5188 tests carry the ``slow``
# marker, and the slow job is the only job that passes ``--cov``. That shard
# alone cannot cover ``app`` more than ~50%, so the previous 60% floor failed
# every run regardless of code quality — the gate was measuring "which tests are
# marked slow", not coverage.
#
# 45 is a floor just under the measured slow-shard total (50), so it still
# catches a real regression (a cluster of newly uncovered modules) without
# failing on shard composition. To reach the intended 60% app-wide target,
# attach ``--cov`` to the fast shard (which runs 3832 tests) and measure there
# first — do not raise this number until that run is taken.
fail_under = 45
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# Tool: Bandit - Security linter (configured via pyproject.toml)
# =============================================================================
[tool.bandit]
targets = ["app"]
exclude_dirs = [
  "tests",
  "migrations",
  "venv",
  ".venv",
  ".eggs",
  ".git",
  "instance",
]
skips = [
  "B101", # assert statements (allowed with explicit intent)
  "B311", # pseudo-random generators (not security-critical here)
  "B324", # SHA1/SHA224 usage (used in audit chain, not crypto)
]
confidence = "HIGH"
severity = "HIGH"

# =============================================================================
# Tool: Setuptools - Python packaging
# =============================================================================
[tool.setuptools.packages.find]
include = ["app*", "legal_paragraph_detection_engine*"]
exclude = [
  "tests*",
  "migrations*",
  "instance*",
  "scripts*",
  "legal_paragraph_detection_engine.tests*",
]

[tool.setuptools.package-data]
"*" = [
  "*.html",
  "*.css",
  "*.js",
  "*.png",
  "*.jpg",
  "*.md",
  "*.txt",
  "*.yaml",
  "*.yml",
]

[tool.maturin]
module-name = "nsa_rust"
manifest-path = "rust/Cargo.toml"
# The Rust extension is optional — pure-Python fallbacks exist in the app.
# Build with:  maturin develop  (from project root)
# On Render/CI: maturin build --release -m rust/Cargo.toml

# =============================================================================
# Tool: isort - Import sorting (used via Ruff, config here for reference)
# =============================================================================
[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["app"]
known_third_party = [
  "alembic",
  "flask",
  "flask_login",
  "flask_migrate",
  "flask_sqlalchemy",
  "flask_talisman",
  "flask_wtf",
  "gspread",
  "gunicorn",
  "httpx",
  "jinja2",
  "openpyxl",
  "pytest",
  "sqlalchemy",
  "weasyprint",
]
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
