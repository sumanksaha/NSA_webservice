<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work Diary of Food Safety Officer (FSO)</title>
<style>
  @page { size: A4; margin: 20mm; }
  body { font-family: 'Times New Roman', Times, serif; color: #000; margin: 30px; }
  .title { text-align: center; font-size: 20px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px; }
  .meta-row { display: flex; justify-content: space-between; font-size: 15px; margin: 6px 0; }
  .meta-row span.label { font-style: italic; }
  .meta-line { border-bottom: 1px solid #000; display: inline-block; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #000; padding: 6px 8px; font-size: 14px; text-align: left; vertical-align: top; }
  th { text-align: center; font-style: italic; }
  th.roman { text-align: center; font-weight: normal; }
  td.date-col { width: 12%; }
  td.place-col { width: 22%; }
  td.purpose-col { width: 30%; }
  td.activity-col { width: 36%; }
  .empty-row td { height: 28px; }
  .sign-block { margin-top: 60px; text-align: right; }
  .sign-line { border-top: 1px solid #000; width: 260px; margin-left: auto; padding-top: 4px; font-size: 14px; text-align: center; }
  .countersign { margin-top: 50px; font-size: 14px; }
  .countersign .underline { text-decoration: underline; font-weight: bold; }
  @media print {
    input, textarea { border: none !important; }
  }
  input[type="text"] {
    border: none;
    border-bottom: 1px solid #000;
    font-family: inherit;
    font-size: 14px;
    width: 100%;
    background: transparent;
  }
  td input[type="text"] { border-bottom: none; }
</style>
</head>
<body>

  <div class="title">Work Diary of Food Safety Officer (FSO)</div>
